<!DOCTYPE html>
<html lang="{{ page.lang | default: 'pt' }}">
<head>
    {% include document-head.html %}
</head>
<body>
    <div class="article-container">
        {% include site-shell.html %}

        <main>
            <article>
                <header class="article-header">
                    <p class="article-kicker">History / Article {{ page.article_number }}</p>
                    <h1>{{ page.title }}</h1>
                    <p class="article-deck">{{ page.deck }}</p>
                    <p class="article-meta">{{ page.byline }} · {{ page.display_date }}</p>
                </header>

                <div class="article-body">
                    {{ content }}
                </div>
            </article>
        </main>

        {% include site-footer.html %}
    </div>

    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
