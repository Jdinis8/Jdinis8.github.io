<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

        content="Selected graphic design work by João D. Álvares, including posters, visual identities, scientific graphics, and editorial experiments."

        content="#ffffff"

    <title>
        Design — João D. Álvares

    <link
        rel="canonical"

    >

    <link
        rel="icon"
        type="image/svg+xml"

    <!-- Apply the saved theme before loading the stylesheets. -->

    <!-- Design-page layout -->

<body>
    <div class="container">
        <header>
            <div>
                <a href="index.html" class="back-link">← Return to Main Page</a>
                <p class="eyebrow">Visual archive / selected work</p>
                <h1>GRAPHIC<br>DESIGN</h1>
                <p class="intro">
                    Posters, visual identities, editorial experiments, scientific graphics,
                    and other selected design work.
                </p>
            </div>

            <div class="header-index" aria-hidden="true">
                <strong>JDA / DESIGN</strong><br>
                Independent archive<br>
                Updated <span id="updated-year"></span>
            </div>
        </header>

        <main>
            <div class="toolbar">
                <div class="filters" id="filters" aria-label="Filter projects"></div>
                <div class="project-count" id="project-count"></div>
            </div>

            <section class="project-grid" id="project-grid" aria-live="polite"></section>
        </main>

        <footer>
            <span>© <span id="copyright-year"></span> João D. Álvares</span>
            <span>
                <a href="mailto:jdlvares@go.olemiss.edu">Email</a> ·
                <a href="https://github.com/Jdinis8" target="_blank" rel="noreferrer">GitHub</a>
            </span>
        </footer>
    </div>

    <div class="modal" id="project-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button class="modal-close" id="modal-close" type="button" aria-label="Close project">×</button>
        <article class="modal-panel">
            <div class="modal-media" id="modal-media"></div>
            <div class="modal-copy">
                <div>
                    <h2 id="modal-title"></h2>
                    <p class="modal-description" id="modal-description"></p>
                </div>
                <p class="modal-meta" id="modal-meta"></p>
            </div>
        </article>
    </div>

    <script>
        /*
         * ADD NEW PROJECTS HERE.
         *
         * image:  path to an image inside your GitHub repository.
         * layout: "portrait" for vertical posters; omit it for the normal landscape card.
         * link:   optional external page, PDF, Behance post, Instagram post, etc.
         *
         * Use either image or pdf. Leave both empty to use the generated placeholder.
         */
        const projects = [
            {
                title: "HellaFull - Sticker Sheet",
                category: "Hella Full",
                year: "2025",
                image: "Images/design/Hella Full/hellafull_stickers.png",
                description: "Mock-up of sticker designs for HellaFull.",
                tools: "Photoshop / Blender"
            },
            {
                title: "Swiss School Series #2",
                category: "Experimental",
                year: "2025",
                image: "Images/design/Swiss School/swiss_attempt2.png",
                description: "A series of designs exploring the Swiss School aesthetic, with a focus on typography, layout, and color.",
                tools: "Illustrator",
                layout: "portrait"
            },
            {
                title: "Ascending",
                category: "Poster",
                year: "2024",
                image: "Images/design/Ascending.png",
                description: "Experimental digital design exploring the concept of ascension.",
                tools: "Photoshop",
                layout: "portrait"
            },
            {
                title: "Voynich Code - Poster Series",
                category: "Music",
                year: "2026",
                image: "Images/design/voynich_code.png",
                layout: "portrait",
                description: "A poster for the Portuguese heavy metal band Voynich Code.",
                tools: "Photoshop"
            },
            {
                title: "Moonspell Tour Alternative Poster",
                category: "Music",
                year: "2026",
                image: "Images/design/moonspell.png",
                description: "A tour poster for Moonspell that I designed for fun, exploring a more experimental and abstract approach to the band's aesthetic.",
                tools: "Photoshop",
                layout: "portrait"
            },
            {
                title: "Swiss School Series #3",
                category: "Experimental",
                year: "2026",
                image: "Images/design/Swiss School/swiss_attempt3.png",
                description: "A series of designs exploring the Swiss School aesthetic, with a focus on typography, layout, and color.",
                tools: "Photoshop",
                layout: "portrait"
            },{
                title: "Swiss School Series #5",
                category: "Experimental",
                year: "2026",
                image: "Images/design/Swiss School/swiss_attempt5.png",
                description: "A series of designs exploring the Swiss School aesthetic, with a focus on typography, layout, and color.",
                tools: "Photoshop",
                layout: "portrait"
            },{
                title: "Swiss School Series #4",
                category: "Experimental",
                year: "2026",
                image: "Images/design/Swiss School/swiss_attempt4.png",
                description: "A series of designs exploring the Swiss School aesthetic, with a focus on typography, layout, and color.",
                tools: "Photoshop",
                layout: "portrait"
            },
            {
                title: "Grão de Areia",
                category: "Single Cover",
                year: "2026",
                image: "Images/design/Grão de Areia/graodeareia6_changes.png",
                layout: "portrait",
                description: "Poster for the first ever single of Grão de Areia, a Portuguese indie band.",
                tools: "Photoshop"
            },
            {
                title: "Lamb of God — Poster Series",
                category: "Music",
                year: "2026",
                image: "Images/design/lambofgod.png",
                layout: "portrait",
                description: "A poster system exploring scientific typography, orbital geometry, and restrained monochromatic composition.",
                tools: "Illustrator / InDesign"
            },
            {
                title: "Swiss School Series #1",
                category: "Experimental",
                year: "2026",
                image: "Images/design/Swiss School/hellafull_swiss.png",
                layout: "portrait",
                description: "A series of designs exploring the Swiss School aesthetic, with a focus on typography, layout, and color.",
                tools: "Illustrator / InDesign"
            },
            {
                title: "Reissner-Nördstrom Black Hole Penrose Diagram",
                category: "Scientific",
                year: "2025",
                image: "Images/design/Physics/RN.jpg",
                description: "Penrose diagram for a Reissner-Nördstrom black hole.",
                tools: "Python",
                layout: "portrait"
            },
            {
                title: "Extended Schwarzschild Black Hole Penrose Diagram",
                category: "Scientific",
                year: "2025",
                image: "Images/design/Physics/SCMax.jpg",
                description: "Extended Penrose diagram for a Schwarzschild black hole.",
                tools: "Python",
                layout: "portrait"
            },
            {
                title: "Trumpet Hyperboloidal Slicing in Schwarzschild Spacetime",
                category: "Scientific",
                year: "2025",
                image: "Images/design/Physics/ScTrumpet.jpg",
                description: "Trumpet hyperboloidal slicing in Schwarzschild spacetime.",
                tools: "Python",
                layout: "portrait"
            },
            {
                title: "HellaFull - Business Card 01",
                category: "Hella Full",
                year: "2025",
                image: "Images/design/Hella Full/hellafull_businesscard.png",
                description: "Business card design for HellaFull, a Mississippi chef.",
                tools: "Photoshop",
                layout: "portrait"
            },
            {
                title: "Vended - Album Cover Series",
                category: "Music",
                year: "2025",
                image: "Images/design/vended.png",
                description: "Cover design for the heavy metal band Vended, designed for fun.",
                tools: "Photoshop",
                layout: "portrait"
            },
            {
                title: "Grão de Areia — Alternative Cover",
                category: "Single Cover",
                year: "2026",
                image: "Images/design/Grão de Areia/graodeareia4.png",
                layout: "portrait",
                description: "Alternative cover for the first single of Grão de Areia.",
                tools: "Photoshop"
            },
        ];

        const fallbackPalettes = [
            ["#311f25", "#101419"],
            ["#17252a", "#171319"],
            ["#2c261b", "#111419"],
            ["#201d31", "#121212"],
            ["#282828", "#16100f"],
            ["#14231d", "#171313"]
        ];

        const grid = document.getElementById("project-grid");
        const filters = document.getElementById("filters");
        const count = document.getElementById("project-count");
        const modal = document.getElementById("project-modal");
        const modalClose = document.getElementById("modal-close");
        const modalMedia = document.getElementById("modal-media");
        const modalTitle = document.getElementById("modal-title");
        const modalDescription = document.getElementById("modal-description");
        const modalMeta = document.getElementById("modal-meta");

        let activeCategory = "All";
        let lastFocusedCard = null;

        const categories = ["All", ...new Set(projects.map(project => project.category))];

        function initials(title) {
            return title
                .split(/\s+/)
                .filter(Boolean)
                .slice(0, 3)
                .map(word => word[0])
                .join("")
                .toUpperCase();
        }

        function createFallback(project, index) {
            const [a, b] = fallbackPalettes[index % fallbackPalettes.length];
            const fallback = document.createElement("div");
            fallback.className = "project-fallback";
            fallback.style.setProperty("--fallback-a", a);
            fallback.style.setProperty("--fallback-b", b);
            fallback.innerHTML = `<span>${initials(project.title)}</span>`;
            return fallback;
        }

        let pdfJsPromise;

        function loadPdfJs() {
            if (!pdfJsPromise) {
                pdfJsPromise = import("https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/build/pdf.min.mjs")
                    .then(pdfjsLib => {
                        pdfjsLib.GlobalWorkerOptions.workerSrc =
                            "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/build/pdf.worker.min.mjs";
                        return pdfjsLib;
                    });
            }
            return pdfJsPromise;
        }

        async function renderPdfPreview(url, canvas, pageNumber = 1) {
            const pdfjsLib = await loadPdfJs();
            const pdf = await pdfjsLib.getDocument(url).promise;
            const page = await pdf.getPage(pageNumber);

            const baseViewport = page.getViewport({ scale: 1 });
            const targetWidth = 1200;
            const viewport = page.getViewport({ scale: targetWidth / baseViewport.width });
            const outputScale = window.devicePixelRatio || 1;
            const context = canvas.getContext("2d", { alpha: false });

            canvas.width = Math.floor(viewport.width * outputScale);
            canvas.height = Math.floor(viewport.height * outputScale);
            canvas.style.aspectRatio = `${viewport.width} / ${viewport.height}`;

            await page.render({
                canvasContext: context,
                viewport,
                transform: outputScale === 1
                    ? null
                    : [outputScale, 0, 0, outputScale, 0, 0]
            }).promise;
        }

        function createVisual(project, index) {
            const visual = document.createElement("div");
            visual.className = "project-visual";

            if (project.layout === "portrait") {
                visual.classList.add("project-visual--portrait");
            }

            if (project.pdf) {
                const canvas = document.createElement("canvas");
                canvas.className = "pdf-preview";
                canvas.setAttribute("role", "img");
                canvas.setAttribute("aria-label", `${project.title} PDF preview`);
                visual.appendChild(canvas);

                renderPdfPreview(project.pdf, canvas, project.page || 1).catch(error => {
                    console.error(`Could not render ${project.pdf}:`, error);
                    visual.replaceChildren(createFallback(project, index));
                });

                return visual;
            }

            if (!project.image) {
                visual.appendChild(createFallback(project, index));
                return visual;
            }

            const image = document.createElement("img");
            image.src = project.image;
            image.alt = `${project.title} preview`;
            image.loading = "lazy";
            image.addEventListener("error", () => {
                visual.replaceChildren(createFallback(project, index));
            }, { once: true });

            visual.appendChild(image);
            return visual;
        }

        function renderFilters() {
            filters.replaceChildren();

            categories.forEach(category => {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "filter-button";
                button.textContent = category;
                button.setAttribute("aria-pressed", String(category === activeCategory));

                button.addEventListener("click", () => {
                    activeCategory = category;
                    renderFilters();
                    renderProjects();
                });

                filters.appendChild(button);
            });
        }

        function renderProjects() {
            const visibleProjects = activeCategory === "All"
                ? projects
                : projects.filter(project => project.category === activeCategory);

            grid.replaceChildren();
            count.textContent = `${visibleProjects.length.toString().padStart(2, "0")} project${visibleProjects.length === 1 ? "" : "s"}`;

            if (visibleProjects.length === 0) {
                const empty = document.createElement("div");
                empty.className = "empty-state";
                empty.textContent = "No projects in this category yet.";
                grid.appendChild(empty);
                return;
            }

            visibleProjects.forEach((project, index) => {
                const card = document.createElement("button");
                card.type = "button";
                card.className = "project-card";
                if (project.layout === "portrait") {
                    card.classList.add("project-card--portrait");
                }
                card.setAttribute("aria-label", `Open ${project.title}`);

                card.appendChild(createVisual(project, index));

                const info = document.createElement("div");
                info.className = "project-info";
                info.innerHTML = `
                    <div>
                        <h2 class="project-title">${project.title}</h2>
                        <p class="project-type">${project.category}</p>
                    </div>
                    <span class="project-year">${project.year}</span>
                `;
                card.appendChild(info);

                card.addEventListener("click", () => {
                    lastFocusedCard = card;
                    openProject(project, index);
                });

                grid.appendChild(card);
            });
        }

        function openProject(project, index) {
            modalTitle.textContent = project.title;
            modalDescription.textContent = project.description;
            modalMedia.replaceChildren(createVisual(project, index));

            modalMeta.innerHTML = `
                <strong>Type</strong><br>${project.category}<br>
                <strong>Year</strong><br>${project.year}<br>
                <strong>Tools</strong><br>${project.tools || "—"}
                ${project.link ? `<br><a class="modal-link" href="${project.link}" target="_blank" rel="noreferrer">View full project ↗</a>` : ""}
            `;

            modal.classList.add("is-open");
            document.body.style.overflow = "hidden";
            modalClose.focus();
        }

        function closeProject() {
            modal.classList.remove("is-open");
            document.body.style.overflow = "";
            lastFocusedCard?.focus();
        }

        modalClose.addEventListener("click", closeProject);

        modal.addEventListener("click", event => {
            if (event.target === modal) closeProject();
        });

        document.addEventListener("keydown", event => {
            if (event.key === "Escape" && modal.classList.contains("is-open")) {
                closeProject();
            }
        });

        const currentYear = new Date().getFullYear();
        document.getElementById("updated-year").textContent = currentYear;
        document.getElementById("copyright-year").textContent = currentYear;

        renderFilters();
        renderProjects();
    </script>
</body>
</html>
