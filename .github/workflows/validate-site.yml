name: Validate site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.0"
          bundler-cache: true

      - name: Build the GitHub Pages site
        run: bundle exec jekyll build --trace

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Test publication data generation
        run: python scripts/test_update_papers.py

      - name: Validate generated links and assets
        run: python scripts/validate_site.py _site
