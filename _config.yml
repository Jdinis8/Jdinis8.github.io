title: João D. Álvares
description: Physics, graphic design, and historical research by João D. Álvares.
url: https://jdinis8.github.io
baseurl: ""

collections:
  history:
    output: true
  notes:
    output: true
    permalink: /notes/:name.html

defaults:
  - scope:
      path: ""
      type: history
    values:
      layout: history-article
      lang: pt
      section: history
  - scope:
      path: ""
      type: notes
    values:
      layout: physics-note
      lang: en
      section: research
      styles:
        - /assets/css/physics-note.css
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - papers.txt
  - scripts
  - source-assets
  - vendor

strict_front_matter: true
