title: João D. Álvares
description: Physics, graphic design, and historical research by João D. Álvares.
url: https://jdinis8.github.io
baseurl: ""

collections:
  history:
    output: true
  design_projects:
    output: true
    permalink: /design/:name/

defaults:
  - scope:
      path: ""
      type: history
    values:
      layout: history-article
      lang: pt
      section: history
  - scope:
      path: ""
      type: design_projects
    values:
      layout: design-project
      lang: en
      section: design
      styles:
        - /assets/css/design.css
        - /assets/css/design-project.css

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - papers.txt
  - scripts
  - source-assets
  - vendor

strict_front_matter: true
